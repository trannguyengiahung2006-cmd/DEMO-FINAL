    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      // ================================================================
      //  👇 DÁN GEMINI API KEY VÀO ĐÂY
      //  Lấy miễn phí tại: https://aistudio.google.com
      // ================================================================
      const GEMINI_KEY = "";
      // ================================================================

      // === ĐOẠN CODE TỔNG HỢP DUY NHẤT (Dán vào dòng 304) ===

      const C = {
        bg: "#F8FAFC",
        surface: "#FFFFFF",
        card: "#F8FAFC",
        accent: "#2563EB",
        accentGlow: "rgba(37,99,235,0.15)",
        text: "#111827",
        textSub: "#4B5563",
        muted: "#6B7280",
        border: "#D1D5DB",
        warn: "#D97706",
        warnBg: "rgba(217,119,6,0.16)",
        cardShadow: "0 8px 24px rgba(15,23,42,0.08)",
      };

      const label = {
        color: C.accent,
        fontSize: 10,
        fontWeight: 700,
        letterSpacing: "0.12em",
        textTransform: "uppercase",
        marginBottom: 8,
        display: "block",
      };

      const inputStyle = {
        display: "block",
        width: "100%",
        background: "#FFFFFF",
        border: `1px solid ${C.border}`, // Lưu ý: Dùng dấu huyền ` (phím dưới Esc)
        borderRadius: 12,
        padding: "12px 16px",
        color: "#111827",
        fontSize: 14,
        transition: "all 0.2s ease",
      };

      const STORAGE_KEYS = {
        PROFILE: "ai_gym_coach_profile",
        CHAT: "ai_gym_coach_chat",
        PLAN: "ai_gym_coach_plan",
        SCREEN: "ai_gym_coach_screen",
      };

      const DISCLAIMER_VERSION = "1.0.0";
      const APP_INFO = {
        name: "AI Gym Coach",
        developer: "Nhóm 5 — Khoa CNTT, ĐH Nông Lâm TP.HCM",
        purpose:
          "Ứng dụng nghiên cứu khoa học — KHÔNG phải sản phẩm y tế thương mại",
        dataPolicy:
          "Dữ liệu chỉ lưu trên thiết bị của bạn (localStorage), không gửi lên server",
      };

      // ── API ĐÃ ĐƯỢC TỐI ƯU LỖI ─────────────────────────────────────────
      async function askAI(messages, system = "") {
        const activeKey = localStorage.getItem("gemini_api_key") || GEMINI_KEY;
        if (
          !activeKey ||
          activeKey.trim() === "" ||
          activeKey === "PASTE_GEMINI_KEY_HERE"
        )
          return "⚠️ Chưa cấu hình Gemini API Key! Vui lòng nhấn vào ⚙️ Cấu hình API Key ở menu bên trái (hoặc biểu tượng 🔑 ở đầu trang trên điện thoại) để nhập key của bạn (miễn phí).";

        // 1. Xử lý lịch sử Chat: BẮT BUỘC tin nhắn đầu tiên gửi đi phải từ 'user'
        // Cắt bỏ các lời chào mặc định của AI (role: assistant) ở đầu mảng
        let validMsgs = [...messages];
        while (validMsgs.length > 0 && validMsgs[0].role !== "user") {
          validMsgs.shift();
        }

        const contents = validMsgs.map((m) => ({
          role: m.role === "assistant" ? "model" : "user",
          parts: [{ text: m.content }],
        }));

        const requestBody = { contents };

        // 2. Từ khóa chuẩn của REST API là systemInstruction (chữ I viết hoa)
        if (system) {
          requestBody.systemInstruction = {
            parts: [{ text: system }],
          };
        }

        try {
          // Sử dụng bản gemini-1.5-flash ổn định nhất cho v1beta
          const res = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeKey}`,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(requestBody),
            },
          );

          // 3. Bắt lỗi HTTP rành mạch để không bị văng xuống catch
          if (!res.ok) {
            const errorText = await res.text();
            try {
              const errorData = JSON.parse(errorText);
              return `⚠️ Lỗi API (${res.status}): ${errorData.error?.message || "Lỗi không xác định"}`;
            } catch {
              return `⚠️ Lỗi Server (${res.status}): Định dạng phản hồi không hợp lệ.`;
            }
          }

          const data = await res.json();
          return (
            data.candidates?.[0]?.content?.parts?.[0]?.text ||
            "Không có phản hồi từ AI."
          );
        } catch (error) {
          return `❌ Không thể kết nối: ${error.message}. Vui lòng kiểm tra lại mạng.`;
        }
      }
      // ── BUILD SYSTEM PROMPT DỰA TRÊN HEALTH PROFILE ──────────────
      function buildSystemPrompt(profile) {
        const conditions = profile.conditions?.length
          ? profile.conditions.join(", ")
          : "Không có";
        const injuries = profile.injuries?.length
          ? profile.injuries.join(", ")
          : "Không có";
        const bmi =
          profile.weight && profile.height
            ? Number(profile.weight / (profile.height / 100) ** 2).toFixed(1)
            : null;
        const bmiClass = bmi
          ? bmi < 18.5
            ? "Thiếu cân"
            : bmi < 22.9
              ? "Bình thường"
              : bmi < 24.9
                ? "Thừa cân"
                : "Béo phì"
          : null;
        const age = Number(profile.age || 0);
        const weight = Number(profile.weight || 0);
        const height = Number(profile.height || 0);
        const gender = (profile.gender || "").toString().toLowerCase();
        const isMale = gender === "nam";
        const daysNum = Number(profile.days);
        const activityFactor =
          daysNum <= 3
            ? 1.375
            : daysNum === 4
              ? 1.55
              : daysNum <= 6
                ? 1.725
                : daysNum === 7
                  ? 1.9
                  : 1.375;
        const bmr =
          weight && height && age
            ? Math.round(
                10 * weight + 6.25 * height - 5 * age + (isMale ? 5 : -161),
              )
            : null;
        const tdee = bmr ? Math.round(bmr * activityFactor) : null;
        const goal = (profile.goal || "").toLowerCase();
        const calTarget = tdee
          ? Math.round(
              tdee +
                (goal.includes("giảm")
                  ? -400
                  : goal.includes("tăng")
                    ? 300
                    : 0),
            )
          : null;
        const proteinMin = weight ? Math.round(weight * 1.6) : null;
        const proteinMax = weight ? Math.round(weight * 2.2) : null;
        const isCardioGoal =
          goal.includes("cải thiện") || goal.includes("cardio");
        const carbTarget = weight
          ? Math.round(weight * (isCardioGoal ? 6 : 4))
          : null;
        const fatTarget = calTarget ? Math.round((calTarget * 0.25) / 9) : null;
        const hrmax = age ? 220 - age : null;
        const hrZoneLight = hrmax
          ? `${Math.round(hrmax * 0.5)}–${Math.round(hrmax * 0.6)}`
          : null;
        const hrZoneMod = hrmax
          ? `${Math.round(hrmax * 0.6)}–${Math.round(hrmax * 0.7)}`
          : null;
        const hrZoneHigh = hrmax
          ? `${Math.round(hrmax * 0.7)}–${Math.round(hrmax * 0.85)}`
          : null;

        return `---
Bạn là AI huấn luyện viên gym. Luôn trả lời tiếng Việt.
KHÔNG tìm kiếm internet. Chỉ dùng dữ liệu khoa học đã cung cấp dưới đây.
Khi đưa ra số liệu, LUÔN ghi nguồn trong ngoặc: [ACSM 2022], [Morton et al. 2018], v.v.

=== HỒ SƠ NGƯỜI DÙNG ===
Tên: ${profile.name}
Tuổi: ${profile.age || "Chưa cung cấp"} | Giới tính: ${profile.gender || "Chưa cung cấp"}
Cân nặng: ${profile.weight ? profile.weight + "kg" : "Chưa cung cấp"} | Chiều cao: ${profile.height ? profile.height + "cm" : "Chưa cung cấp"}
BMI: ${bmi || "Chưa có"} ${bmiClass ? `(${bmiClass})` : ""} (phân loại chuẩn châu Á — WHO/Bộ Y tế VN 2020: Thiếu cân <18.5 | Bình thường 18.5–22.9 | Thừa cân 23–24.9 | Béo phì ≥25)
Mục tiêu: ${profile.goal} | Trình độ: ${profile.level} | Số buổi/tuần: ${profile.days}

=== CHỈ SỐ NĂNG LƯỢNG (ĐÃ TÍNH SẴN — DÙNG TRỰC TIẾP) ===
BMR: ${bmr || "Chưa có"} kcal/ngày [Mifflin-St Jeor, Am J Clin Nutr 1990]
TDEE: ${tdee || "Chưa có"} kcal/ngày [ACSM Guidelines 11th ed. 2022]
Mục tiêu calo: ${calTarget || "Chưa có"} kcal/ngày [Thomas et al., J Acad Nutr Diet 2016]
Mục tiêu protein: ${proteinMin || ""}–${proteinMax || ""}g/ngày [Morton et al., BJSM 2018]
Mục tiêu carb: ${carbTarget || "Chưa có"}g/ngày | Mục tiêu fat: ${fatTarget || "Chưa có"}g/ngày [Thomas et al. 2016]

=== NHỊP TIM MỤC TIÊU (ĐÃ TÍNH SẴN) ===
HRmax: ${hrmax || "Chưa có"} bpm (220 - tuổi) [ACSM 2022]
Zone nhẹ (an toàn tim mạch): ${hrZoneLight || "Chưa có"} bpm
Zone vừa (đốt mỡ hiệu quả): ${hrZoneMod || "Chưa có"} bpm
Zone cao (cải thiện cardio): ${hrZoneHigh || "Chưa có"} bpm

=== TÌNH TRẠNG SỨC KHỎE ===
Bệnh nền: ${conditions}
Chấn thương/Vùng tránh: ${injuries}

=== QUY TẮC AN TOÀN BẮT BUỘC ===
${profile.conditions?.includes("Tim mạch / Huyết áp") ? `⚠️ TIM MẠCH (ACSM 2022 Ch.9): TUYỆT ĐỐI không đề xuất HIIT, sprint, bài compound nặng, Valsalva maneuver. Nhịp tim KHÔNG vượt ${hrZoneLight} bpm (zone nhẹ). Ưu tiên đi bộ, đạp xe nhẹ, bơi lội. Warm-up/cool-down tối thiểu 10 phút.` : ""}
${profile.conditions?.includes("Tiểu đường") ? `⚠️ TIỂU ĐƯỜNG (ACSM 2022 Ch.10): Chỉ tập khi đường huyết 100–250 mg/dL. Tránh tập khi đói hoặc đường huyết <100 mg/dL. Mang đồ ăn ngọt bên cạnh. Tập resistance training 2–3x/tuần giúp cải thiện insulin sensitivity.` : ""}
${profile.conditions?.includes("Xương khớp / Thoát vị đĩa đệm") ? `⚠️ XƯƠNG KHỚP (ACSM 2022 Ch.11 + NSCA 2016): TUYỆT ĐỐI không đề xuất Barbell Squat, Deadlift, Good Morning, bài tạo lực nén cột sống. Ưu tiên bơi lội (giảm 90% áp lực khớp), Dead Bug, Bird-dog, Plank nhẹ.` : ""}
${profile.conditions?.includes("Hô hấp / Hen suyễn") ? `⚠️ HÔ HẤP (ACSM 2022 Ch.12): Cấm HIIT, sprint, burpee. Warm-up kéo dài ≥15 phút để tránh EIB. Ưu tiên bơi lội. Luôn có thuốc hít bên cạnh.` : ""}
${profile.conditions?.includes("Béo phì / Thừa cân") ? `⚠️ BÉO PHÌ (ACSM 2022 + Thomas et al. 2016): Ưu tiên low-impact cardio (đi bộ, đạp xe, bơi). Bắt đầu 150 phút/tuần, tăng dần 250–300 phút/tuần. Thâm hụt calo tối đa 500 kcal/ngày.` : ""}
${profile.injuries?.length ? `⚠️ CHẤN THƯƠNG (${injuries}) — NSCA 2016: TUYỆT ĐỐI không đề xuất bài tập tạo lực trực tiếp lên vùng này.` : ""}
${profile.conditions?.length ? `⚠️ BẮT BUỘC: Kết thúc mỗi lời tư vấn bằng "Nên tham khảo bác sĩ chuyên khoa trước khi bắt đầu."` : ""}

=== KIẾN THỨC KHOA HỌC NỀN (DÙNG KHI TƯ VẤN) ===

[ACSM 2022 — Sets/Reps theo trình độ]
Mới bắt đầu: 2–3 buổi/tuần, 1–3 sets, 8–12 reps, 60–70% 1RM, nghỉ 1–2 phút
Trung bình:  3–4 buổi/tuần, 3–4 sets, 6–12 reps, 67–85% 1RM, nghỉ 1–2 phút
Nâng cao:    4–6 buổi/tuần, 3–6 sets, 1–12 reps, 70–100% 1RM, nghỉ 2–3 phút
Progressive overload: tăng tối đa 10%/tuần
Warm-up 5–10 phút, cool-down 5–10 phút bắt buộc

[ACSM 2022 — Cardio]
Cường độ vừa: 150–300 phút/tuần
Cường độ cao: 75–150 phút/tuần
Hoặc kết hợp tương đương

[Morton et al. 2018 — BJSM Meta-analysis, n=49 nghiên cứu]
Protein tối ưu tăng cơ: 1.6–2.2g/kg/ngày
Chia 3–5 bữa, mỗi bữa 0.3–0.4g/kg (tối ưu kích hoạt MPS)
Whey sau tập (trong 30–60 phút): 20–40g
Trên 65 tuổi: tăng lên 1.8–2.4g/kg/ngày

[Thomas, Erdman & Burke 2016 — AND/DC/ACSM Position Statement]
Carb tập tạ: 3–5g/kg/ngày
Carb tập sức bền: 5–10g/kg/ngày
Chất béo: 20–35% tổng calo, không được dưới 20%
Nước: 500ml trước tập 2 giờ; 150–250ml mỗi 15–20 phút trong tập

[NSCA Essentials of S&C, 4th ed. 2016]
Thứ tự bài trong buổi: compound nặng trước, isolation sau
Cơ cần 48–72 giờ phục hồi trước khi tập lại cùng nhóm
Full-body: 2–3 buổi/tuần; Upper/Lower: 4 buổi; PPL: 5–6 buổi
1RM ước tính (Epley): weight × (1 + reps/30)

[Bộ Y tế Việt Nam 2020]
Khuyến nghị ≥150 phút hoạt động thể lực/tuần
Ưu tiên thực phẩm: gạo lứt, rau xanh, đậu hũ, cá, thịt nạc

=== QUY TẮC ĐỊNH DẠNG ===
- Dùng **IN ĐẬM** cho tiêu đề
- Mỗi bài tập trên 1 dòng riêng, ghi rõ: Tên | Sets×Reps | Nghỉ | Nhóm cơ
- Luôn ghi nguồn khi đưa ra số liệu
- Cuối mỗi tư vấn về sức khỏe: thêm dòng "⚠️ Tư vấn tham khảo, không thay thế ý kiến bác sĩ"
---`;
      }

      // ── SHARED UI ─────────────────────────────────────────────────
      const chip = (active, small = false) => ({
        background: active ? C.accent : C.surface,
        color: active ? "#fff" : C.textSub,

      function Chat({ profile, initMsgs, onMsgsChange }) {
        const defaultMsg = [
          {
            role: "assistant",
            content: `Chào ${profile.name}! 💪\nMình là AI Coach của bạn.\n\nHỏi mình bất cứ điều gì về tập luyện!`,
          },
        ];
        const [msgs, setMsgs] = useState(initMsgs || defaultMsg);
        const [input, setInput] = useState("");
        const [loading, setLoading] = useState(false);
        const bottomRef = useRef(null);
        useEffect(() => {
          bottomRef.current?.scrollIntoView({ behavior: "smooth" });
        }, [msgs]);

        const SYS = buildSystemPrompt(profile);

        const QUICK = [
          "Bài tập phù hợp hôm nay?",
          "Cách khởi động đúng?",
          "Tôi muốn tăng cơ, nên làm gì?",
        ];

        const send = async () => {
          if (!input.trim() || loading) return;
          const u = { role: "user", content: input };
          const next = [...msgs, u];
          setMsgs(next);
          onMsgsChange?.(next);
          setInput("");
          setLoading(true);
          const reply = await askAI(next, SYS);
          const final = [...next, { role: "assistant", content: reply }];
          setMsgs(final);
          onMsgsChange?.(final);
          setLoading(false);
        };

        return (
          <div
            style={{
              display: "flex",
              flexDirection: "column",
              flex: 1,
              minHeight: 0,
              background: C.bg,
            }}
          >
            <div
              style={{
                flex: 1,
                overflowY: "auto",
                padding: "20px",
                display: "flex",
                flexDirection: "column",
                gap: 16,
                background: C.bg,
                backgroundImage:
                  "radial-gradient(circle at 50% 10%, rgba(0, 200, 83, 0.03) 0%, transparent 80%)",
              }}
            >
              {msgs.map((m, i) => (
                <div
                  key={i}
                  style={{
                    display: "flex",
                    justifyContent:
                      m.role === "user" ? "flex-end" : "flex-start",
                    alignItems: "flex-end",
                    gap: 10,
                  }}
                >
                  {m.role === "assistant" && (
                    <div
                      style={{
                        width: 32,
                        height: 32,
                        borderRadius: "50%",
                        background: C.accentGlow,
                        border: `1px solid ${C.accent}`,
                        display: "flex",
                        alignItems: "center",
                        justifyContent: "center",
                        fontSize: 16,
                        flexShrink: 0,
                      }}
                    >
                      🤖
                    </div>
                  )}
                  <div
                    style={{
                      maxWidth: "80%",
                      background: m.role === "user" ? C.accent : C.card,
                      color: m.role === "user" ? "#000" : C.text,
                      borderRadius:
                        m.role === "user"
                          ? "18px 18px 4px 18px"
                          : "4px 18px 18px 18px",
                      padding: "12px 16px",
                      fontSize: "14px",
                      lineHeight: "1.7",
                      whiteSpace: "pre-wrap",
                      boxShadow: "0 4px 12px rgba(0,0,0,0.1)",
                      border:
                        m.role === "assistant"
                          ? `1px solid ${C.border}`
                          : "none",
                    }}
                  >
                    {m.content}
                  </div>
                </div>
              ))}
              {loading && (
                <div
                  style={{ display: "flex", alignItems: "flex-end", gap: 10 }}
                >
                  <div
                    style={{
                      width: 32,
                      height: 32,
                      borderRadius: "50%",
                      background: C.accentGlow,
                      border: `1px solid ${C.accent}`,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                    }}
                  >
                    🤖
                  </div>
                  <div
                    style={{
                      background: C.card,
                      padding: "12px 20px",
                      borderRadius: "4px 18px 18px 18px",
                      border: `1px solid ${C.border}`,
                    }}
                  >
                    <span
                      style={{
                        color: C.accent,
                        letterSpacing: 4,
                        fontSize: 20,
                      }}
                    >
                      •••
                    </span>
                  </div>
                </div>
              )}
              <div ref={bottomRef} />
            </div>

            {msgs.length === 1 && !loading && (
              <div
                style={{
                  padding: "0 16px 8px",
                  display: "flex",
                  gap: 8,
                  flexWrap: "wrap",
                }}
              >
                {QUICK.map((q) => (
                  <button
                    key={q}
                    onClick={() => setInput(q)}
                    style={{
                      background: C.card,
                      border: `1px solid ${C.border}`,
                      borderRadius: 20,
                      padding: "6px 12px",
                      color: C.muted,
                      fontSize: 12,
                    }}
                  >
                    {q}
                  </button>
                ))}
              </div>
            )}

            <div
              style={{
                padding: "16px 20px",
                background: C.surface,
                borderTop: `1px solid ${C.border}`,
                display: "flex",
                gap: 12,
                alignItems: "center",
              }}
            >
              <input
                value={input}
                onChange={(e) => setInput(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && send()}
                placeholder="Hỏi coach..."
                style={{
                  ...inputStyle,
                  flex: 1,
                  marginTop: 0,
                  borderRadius: 24,
                }}
              />
              <button
                onClick={send}
                style={{
                  width: 48,
                  height: 48,
                  borderRadius: "50%",
                  background: loading ? C.border : C.accent,
                  border: "none",
                  color: "#000",
                  fontSize: 20,
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  cursor: loading ? "default" : "pointer",
                  boxShadow: loading ? "none" : `0 4px 12px ${C.accentGlow}`,
                }}
              >
                {loading ? "..." : "↑"}
              </button>
            </div>
          </div>
        );
      }

            const injuryOk = !ex.contraindications.some((c) =>

            const conditionOk = !userConditions.some((cond) => {
              const banned = [

                ...(EXERCISE_DB.HARD_RULES?.contraindicationRules[cond] || []),

              return banned.some((bannedName) => ex.name.includes(bannedName));

            return levelOk && injuryOk && conditionOk;

        return result;

          askAI(
            [
              {
                role: "user",
                content: `1 mẹo dinh dưỡng quan trọng nhất cho người mục tiêu ${profile.goal}, ${profile.conditions?.length ? "bệnh nền: " + profile.conditions.join(", ") : ""} tập ${profile.days} buổi/tuần. Chỉ 2 câu.`,
              },
            ],
            "Chuyên gia dinh dưỡng thể thao. Tiếng Việt ngắn gọn.",
          ).then((t) => {
            setTip(t);
            setTipLoad(false);

        const ask = async () => {
          if (!q.trim() || loading) return;
          setLoading(true);
          const sys = `Chuyên gia dinh dưỡng thể thao. Tiếng Việt ngắn gọn. Người dùng: mục tiêu ${profile.goal}, ${profile.conditions?.length ? "bệnh nền: " + profile.conditions.join(", ") : ""}, ${profile.days} buổi/tuần.`;
          const reply = await askAI([{ role: "user", content: q }], sys);
          setAns(reply);
          setLoading(false);
        };

        const addMeal = () => {
          if (!food.trim()) return;
          setMeals([...meals, { food, cals: parseInt(cals) || 0 }]);

        const total = meals.reduce((s, m) => s + m.cals, 0);

                  {total}
                </div>
                <div style={{ color: C.muted, fontSize: 13, marginTop: 4 }}>
                  calo hôm nay
                </div>
              </div>
              <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>

                  value={food}
                  onChange={(e) => setFood(e.target.value)}

                <button

                  style={{
                    background: C.accent,
                    color: "#000",

                    borderRadius: 10,

                    fontSize: 18,

              </div>
              {meals.length === 0 && (
                <p

                    color: C.muted,
                    fontSize: 13,
                    textAlign: "center",
                    padding: "20px 0",

                </p>
              )}
              {meals.map((m, i) => (
                <div
                  key={i}
                  style={{
                    background: C.surface,
                    border: `1px solid ${C.border}`,
                    borderRadius: 10,
                    padding: "10px 14px",

                      style={{ fontSize: 14, color: C.accent, fontWeight: 600 }}

                    </span>
                    <button
                      onClick={() => setMeals(meals.filter((_, j) => j !== i))}
                      style={{

        return (

      // GOAL MODAL
      // ════════════════════════════════════════════════════════════════
      function GoalModal({ profile, onSave, onClose }) {
        const [name, setName] = useState(profile.name);
        const [age, setAge] = useState(profile.age);
        const [weight, setWeight] = useState(profile.weight);
        const [height, setHeight] = useState(profile.height);
        const [goal, setGoal] = useState(profile.goal);
        const [level, setLevel] = useState(profile.level);
        const [days, setDays] = useState(profile.days);
        const [conditions, setConditions] = useState(profile.conditions || []);

        // Logic mới: Quản lý ô nhập bệnh nền
        const [newCondition, setNewCondition] = useState("");

        // Logic mới: Tính toán chỉ số và tình trạng BMI
        const getBMIInfo = () => {
          if (!weight || !height)
            return { score: "--", status: "---", color: "#6B7280" };
          const score = (weight / (height / 100) ** 2).toFixed(1);
          let status = "Bình thường";
          let color = C.accent;

          if (score < 18.5) {
            status = "Thiếu cân";
            color = "#60A5FA";
          } else if (score >= 25 && score < 30) {
            status = "Thừa cân";
            color = "#FACC15";
          } else if (score >= 30) {
            status = "Béo phì";
            color = "#EF4444";
          }

          return { score, status, color };
        };

        const bmiInfo = getBMIInfo();

        // Logic mới: Hàm thêm bệnh nền vào danh sách
        const addCondition = () => {
          if (newCondition.trim()) {
            setConditions([...conditions, newCondition.trim()]);
            setNewCondition(""); // Xóa ô nhập sau khi thêm
          }
        };

        return (
          <div
            style={{
              position: "fixed",
              inset: 0,
              background: "rgba(255,255,255,0.8)",
              backdropFilter: "blur(6px)",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              zIndex: 9999,
              padding: "20px",
            }}
            onClick={onClose}
          >
            <div
              style={{
                background: "#FFFFFF",
                borderRadius: "24px",
                width: "100%",
                maxWidth: "600px",
                border: `1.5px solid ${C.accent}`,
                boxShadow: `0 0 30px ${C.accent}20`,
                overflow: "hidden",
                animation: "fadeIn 0.3s ease",
              }}
              onClick={(e) => e.stopPropagation()}
            >
              {/* Header */}
              <div
                style={{
                  background: `linear-gradient(90deg, ${C.accent}20, transparent)`,
                  padding: "20px 24px",
                  borderBottom: "1px solid #D1D5DB",
                  display: "flex",
                  justifyContent: "space-between",
                  alignItems: "center",
                }}
              >
                <h2
                  style={{
                    fontFamily: "'Barlow Condensed', sans-serif",
                    fontSize: "24px",
                    fontWeight: "800",
                    color: "#111827",
                    letterSpacing: "0.05em",
                  }}
                >
                  CHỈNH SỬA MỤC TIÊU & THÔNG TIN
                </h2>
                <button
                  onClick={onClose}
                  style={{
                    background: "none",
                    border: "none",
                    color: "#6B7280",
                    fontSize: "28px",
                    cursor: "pointer",
                  }}
                >
                  ×
                </button>
              </div>

              <div
                style={{
                  padding: "24px",
                  maxHeight: "75vh",
                  overflowY: "auto",
                }}
              >
                {/* Row 1: Stats */}
                <div
                  style={{
                    display: "grid",
                    gridTemplateColumns: "2fr 1fr 1fr 1fr",
                    gap: "12px",
                    marginBottom: "20px",
                  }}
                >
                  <div>
                    <div style={label}>👤 Tên</div>
                    <input
                      value={name}
                      onChange={(e) => setName(e.target.value)}

                      fontSize: 12,
                      color: C.warn,
                      fontWeight: 600,
                    }}
                  >
                    ⚕️ Đang kích hoạt chế độ an toàn bệnh lý
                  </div>
                )}
              </div>

              {/* Dynamic Tab Screens */}
              <div
                className="app-shell-inner"
                style={{ flex: 1, overflow: "hidden" }}
              >
                <div
                  style={{
                    display: tab === "chat" ? "flex" : "none",
                    height: "100%",
                  }}
                >
                  {profile && (
                    <Chat
                      profile={profile}
                      initMsgs={chatMsgs}
                      onMsgsChange={setChatMsgs}
                    />
                  )}
                </div>
                <div
                  style={{
                    display: tab === "schedule" ? "flex" : "none",
                    height: "100%",
                  }}
                >
                  {profile && (
                    <Schedule
                      profile={profile}
                      savedPlan={schedule}
                      onPlanChange={setSchedule}
                    />
                  )}
                </div>
                <div
                  style={{
                    display: tab === "checkin" ? "flex" : "none",
                    height: "100%",
                  }}
                >
                  {profile && <HealthCheckin profile={profile} />}
                </div>
                <div
                  style={{
                    display: tab === "nutrition" ? "flex" : "none",
                    height: "100%",
                  }}
                >
                  {profile && <Nutrition profile={profile} />}
                </div>
              </div>

              {/* Bottom Nav Mobile */}
              <div
                className="mobile-nav"
                style={{
                  background: C.surface,
                  borderTop: `1px solid ${C.border}`,
                  display: "flex",
                  paddingBottom: "env(safe-area-inset-bottom)",
                }}
              >
                {TABS.map((t) => (
                  <button
                    key={t.id}
                    onClick={() => setTab(t.id)}
                    style={{
                      flex: 1,
                      background: "none",
                      border: "none",
                      padding: "12px 0",
                      display: "flex",
                      flexDirection: "column",
                      alignItems: "center",
                      gap: 4,
                    }}
                  >
                    <span
                      style={{ fontSize: 20, opacity: tab === t.id ? 1 : 0.5 }}
                    >
                      {t.icon}
                    </span>
                    <span
                      style={{
                        fontSize: 10,
                        fontWeight: 700,
                        color: tab === t.id ? C.accent : C.muted,
                      }}
                    >
                      {t.label}
                    </span>
                    {tab === t.id && (
                      <div
                        style={{
                          width: 16,
                          height: 3,
                          background: C.accent,
                          borderRadius: 2,
                          marginTop: 4,
                        }}
                      />
                    )}
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);

      // Render demo buttons sau khi React load
      setTimeout(() => {
        const panel = document.getElementById("demo-buttons");
        if (!panel) return;
        if (typeof DEMO_SCENARIOS === "undefined") return;
        DEMO_SCENARIOS.forEach((sc, i) => {
          const btn = document.createElement("button");
          btn.textContent = sc.label;
          btn.style.cssText =
            "display:block;width:100%;margin-bottom:6px;background:#F8FAFC;border:1px solid #D1D5DB;border-radius:8px;padding:7px 10px;color:#111827;font-size:11px;cursor:pointer;text-align:left;font-family:DM Sans,sans-serif";
          btn.onmouseover = () => (btn.style.borderColor = "#2563EB");
          btn.onmouseout = () => (btn.style.borderColor = "#D1D5DB");
          btn.onclick = () => {
            // Lưu profile vào localStorage để App đọc
            localStorage.setItem(
              "__demo_profile__",
              JSON.stringify(sc.profile),
            );
            location.href = location.pathname + "?demo=1&load=1";
          };
          panel.appendChild(btn);
        });
      }, 800);

      // Tự động load demo profile nếu có
      const _dp = localStorage.getItem("__demo_profile__");
      if (_dp && new URLSearchParams(location.search).get("load") === "1") {
        localStorage.removeItem("__demo_profile__");
        const _prof = JSON.parse(_dp);
        // Inject vào React sau khi mount
        setTimeout(() => {
          const _evt = new CustomEvent("load-demo-profile", { detail: _prof });
          window.dispatchEvent(_evt);
        }, 500);
      }
    </script>
  </body>
</html>
